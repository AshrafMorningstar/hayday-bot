[workspace]
resolver = "2"
members = [
    "crates/hd-core",
    "crates/hd-host",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["AshrafMorningstar"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
log = "0.4"
